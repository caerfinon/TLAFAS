// -----------------------------------------------------------------
//	CONTRACT Groups: The Life Aquatic For All Systems  
//	Author: Caerfinon 
// -----------------------------------------------------------------
// In the folder GameData\TLAFAS\Patches there is a file called TLAFASContractGroupPatch.cfg.StockTemplate
// Copy this file to a directory in your GameData where you normally keep your Module Manager patch files
// Rename the file to TLAFASContractGroupPatch.cfg
// This is the file you will edit to define your world's naval bases 
// -----------------------------------------------------------------

CONTRACT_GROUP
{
    name = TFAS
    displayName = The Life Aquatic For All Systems
    sortKey = TLAFAS00
    agent = TLA For All Systems
    minVersion = 1.30.5
    maxCompletions = 0
    maxSimultaneous = 0

// -----------------------------------------------------------------
// Data Nodes
// -----------------------------------------------------------------	
	
	// What planet is the homeworld?
	DATA
	{
		type = CelestialBody	
		whereAreWe = HomeWorld() 
	}
	
	// The the depth ranges under water {[MIN],[MAX])
    // Waypoint generator needs to use underwater = ture.
    // The MIN altitude is clamped to the sea-floor if a value lower then the sea-floor is generated
    // the way-point will be set to the Sea floor at the location.
    // Depth values tested with part pressure enabled using Sunk Works diving equipment 
    // and the USI Otter submarine. The Scuba gear can be users for shallow and medium depths. 
    // The Deep Sea Diving equipment and the Otter Sub can be used at all depths. 
   
	DATA
	{
        type = List<double>	
		depthShallow = {[-50],[-1]}    	
        depthMedium = {[-240],[-50]}
		depthDeep = {[-1300],[-241]}
	}

	// Base value of Mission Rewards
	DATA
	{
		type = double	
		rewardBaseValue = (HomeWorld().Radius() / 1000 ) * 10
	}
	
	// The percentage chance that a Boffin will join the Space Program
	DATA
	{
		type = int	
		boffinChoiceChance = 4
	}
	
	// Flight destinations start at index 1
	DATA
	{
		type = int	
		siteComm2Start = 1
	}

	// Flight destinations end at the count of all sites minus 1 for the KSC. 
	DATA
	{
		type = int	
		siteComm2Stop = @/siteName.Count() - 1
	}
// -----------------------------------------------------------------
// All base data needs to be loaded from a Module Manager patch file. See README.MD
// -----------------------------------------------------------------

// -----------------------------------------------------------------
// Sub Groups
// -----------------------------------------------------------------

	// Science and Discovery voyages
	CONTRACT_GROUP
	{
		name = KSP Maritime Oceanograpy
		displayName = KSP Maritime Oceanograpy
		minVersion = 1.30.5
		sortKey = TLAFAS01
		agent = KSP Maritime Service
		maxSimultaneous = 3
		maxCompletions = 0
    }
	
	// Reentry capsule recovery
	CONTRACT_GROUP
	{
		name = KSP Maritime Recovery
		displayName = KSP Maritime Recovery
		minVersion = 1.30.5
		sortKey = TLAFAS02
		agent = KSP Maritime Service
		maxSimultaneous = 3
		maxCompletions = 0
	}
	
	// Wrecks - submerged and surface resue/retrieval
	CONTRACT_GROUP
	{
		name = KSP Maritime Rescue
		displayName = KSP Maritime Resuce
		minVersion = 1.30.5
		sortKey = TLAFAS03
		agent = KSP Maritime Service
		maxSimultaneous = 2
		maxCompletions = 0
	}
	
	// Passenger voyages and Ports of Call progression 
	CONTRACT_GROUP
	{
		name = KSP Maritime Transport
		displayName = KSP Maritime Transport
		minVersion = 1.30.5
		sortKey = TLAFAS04
		agent = KSP Maritime Service
		maxSimultaneous = 1
		maxCompletions = 0
		
	}
}
